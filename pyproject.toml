[project]
name = "service-auth"
version = "0.1.0"
description = "Self-hosted authentication and authorization service for AI agents and service-to-service workloads"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "uvicorn[standard]>=0.35,<1",
  "pydantic-settings>=2.10,<3",
  "PyJWT>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.20,<1",
]

[project.optional-dependencies]
test = [
  "httpx>=0.28,<1",
  "pytest>=8.4,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
